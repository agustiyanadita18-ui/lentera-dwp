<title>LENTERA — Pusat Informasi Digital</title>
<style>
:root{
  --blue:#075aa8; --blue2:#0b79d0; --navy:#06427f; --soft:#eef7ff;
  --line:#dceaf6; --text:#17324d; --muted:#6a8196; --green:#1caa61;
  --shadow:0 8px 25px rgba(17,76,126,.10); --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#edf6fd;color:var(--text)}
button,input,select{font:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;box-shadow:0 0 35px rgba(0,0,0,.08)}
.topbar{position:sticky;top:0;z-index:20;height:62px;background:linear-gradient(135deg,#06447f,#0878c9);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.brand{font-weight:800;letter-spacing:.5px;font-size:18px;display:flex;gap:8px;align-items:center}
.brand-mark{font-size:22px}
.icon-btn{border:0;background:transparent;color:white;font-size:24px;cursor:pointer}
main{padding-bottom:78px}
.hero{background:linear-gradient(180deg,#064b8b 0%,#087bcf 56%,#eaf6ff 56%,#fff 100%);padding:0 14px 18px}
.hero-image{height:190px;border-radius:0 0 24px 24px;display:flex;align-items:flex-end;padding:18px 16px;background:
linear-gradient(180deg,rgba(0,54,110,.08),rgba(0,45,95,.78)),
linear-gradient(135deg,#79b9e9,#d8efff);color:#fff}
.hero h1{font-size:29px;margin:0 0 4px}
.hero p{margin:0;font-size:13px;line-height:1.5}
.hero-card{background:white;border-radius:22px;margin:-1px 2px 0;padding:15px;box-shadow:var(--shadow)}
.welcome{font-size:19px;font-weight:800;color:var(--navy);margin:0 0 5px}
.muted{color:var(--muted);font-size:13px;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.grid .menu-card:nth-child(4),.grid .menu-card:nth-child(5){grid-column:span 1}
.menu-card{border:1px solid var(--line);background:#f8fcff;border-radius:15px;padding:13px 7px;text-align:center;cursor:pointer;color:var(--navy);font-weight:700;font-size:11px;min-height:82px}
.menu-card .ico{display:block;font-size:26px;margin-bottom:7px}
.section{padding:18px 14px}
.section-title{font-size:20px;color:var(--navy);margin:0 0 6px;font-weight:800}
.section-sub{font-size:13px;color:var(--muted);margin-bottom:14px}
.card{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff;box-shadow:var(--shadow);margin-bottom:11px}
.card-row{display:flex;gap:12px;align-items:flex-start}
.card-icon{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.card h3{margin:0 0 5px;color:var(--navy);font-size:15px}
.card p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}
.btn{border:0;background:linear-gradient(135deg,#0872c7,#0792dc);color:white;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:700;cursor:pointer}
.btn.secondary{background:#edf7ff;color:#0863a8}
.actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.searchbox{display:flex;gap:8px;margin:12px 0}
.searchbox input{flex:1;border:1px solid #cfe2f2;border-radius:12px;padding:12px 13px;outline:none}
.searchbox input:focus{border-color:#1684d5;box-shadow:0 0 0 3px #e5f4ff}
.selects{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.selects select{width:100%;border:1px solid #cfe2f2;border-radius:11px;padding:10px;background:white;color:var(--text)}
.count{font-size:12px;color:var(--muted);margin:8px 0 10px}
.book-card{display:flex;gap:11px;padding:11px;border:1px solid var(--line);border-radius:15px;margin-bottom:9px}
.book-cover{width:64px;height:82px;border-radius:8px;background:linear-gradient(145deg,#075aa8,#63b5eb);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:11px;text-align:center;padding:6px;flex:0 0 auto}
.book-info{min-width:0;flex:1}
.book-title{font-weight:800;color:var(--navy);font-size:14px;line-height:1.25}
.book-meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.45}
.status{display:inline-block;color:#0b8b4e;background:#e4f8ed;padding:3px 7px;border-radius:999px;font-size:10px;font-weight:700}
.detail-head{display:flex;gap:15px;align-items:center;margin-bottom:15px}
.detail-cover{width:115px;height:155px;border-radius:10px;background:linear-gradient(145deg,#075aa8,#67b8ec);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;text-align:center;padding:12px}
.detail-title{font-size:22px;color:var(--navy);font-weight:800;margin-bottom:4px}
.detail-author{font-size:13px;color:var(--muted)}
.table{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:105px 1fr;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px}
.tr:last-child{border-bottom:0}.tr b{color:var(--navy)}
.quote{background:#eaf7ff;border:1px solid #c9e9ff;border-radius:15px;padding:14px;font-size:13px;line-height:1.5;color:#155d8f}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);height:68px;background:#064b88;color:white;display:grid;grid-template-columns:repeat(4,1fr);z-index:30;box-shadow:0 -4px 18px rgba(0,0,0,.12)}
.bottom button{border:0;background:transparent;color:white;font-size:10px;cursor:pointer;padding:5px}
.bottom .ico{display:block;font-size:21px;margin-bottom:3px}
.bottom button.active{background:#0879c9}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px}
.back{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#123d61;color:#fff;padding:9px 14px;border-radius:999px;font-size:11px;display:none;z-index:50}
@media(min-width:700px){body{padding:20px}.app{border-radius:25px;overflow:hidden}}
</style>
</head>

let current='home';

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800);}
function setActive(id){
  document.querySelectorAll('.bottom button').forEach(x=>x.classList.remove('active'));
  const b=document.getElementById('nav-'+id); if(b)b.classList.add('active');
}
function show(page){
  current=page; setActive(page==='catalog'?'catalog':page==='ebook'?'ebook':page==='rekom'?'rekom':'home');
  if(page==='home') home();
  if(page==='admin') adminPage();
  if(page==='ebook') ebookPage();
  if(page==='catalog') catalogPage();
  if(page==='rekom') rekomPage();
}
function home(){
  const i=DATA.info||{};
  document.getElementById('content').innerHTML=`
  <section class="hero">
    <div class="hero-image"><div><h1>${esc(i.NAMA||'LENTERA')}</h1><p>${esc(i.SEKOLAH||'DWP SMAN 1 Ngronggot')}<br>${esc(i.SUBJUDUL||'Pusat Informasi Digital')}</p></div></div>
    <div class="hero-card">
      <div class="welcome">Selamat Datang di LENTERA</div>
      <div class="muted">${esc(i.DESKRIPSI||'Pojok Literasi Kreatif')}</div>
      <div class="grid">
        <div class="menu-card" onclick="show('home')"><span class="ico">⌂</span>Beranda</div>
        <div class="menu-card" onclick="show('admin')"><span class="ico">⚙</span>Administrasi & Inovasi</div>
        <div class="menu-card" onclick="show('ebook')"><span class="ico">▣</span>E-Book</div>
        <div class="menu-card" onclick="show('catalog')"><span class="ico">▤</span>Katalog Digital</div>
        <div class="menu-card" onclick="show('rekom')"><span class="ico">♧</span>Rekomendasi Digital</div>
      </div>
      <div class="quote" style="margin-top:14px">📚 Membaca hari ini, untuk masa depan yang lebih baik.</div>
    </div>
  </section>`;
}
function adminPage(){
  const rows=DATA.admin||[];
  document.getElementById('content').innerHTML=`<section class="section">
    <button class="btn secondary back" onclick="show('home')">← Kembali</button>
    <h2 class="section-title">⚙️ Administrasi & Inovasi</h2>
    <div class="section-sub">Informasi, program, dan inovasi LENTERA.</div>
    ${rows.map((r,idx)=>`<div class="card"><div class="card-row"><div class="card-icon">${esc(r.Icon||['📚','📋','📖','💡'][idx%4])}</div><div><h3>${esc(r.Judul)}</h3><p>${esc(r.Isi)}</p></div></div></div>`).join('')}
  </section>`;
}
function ebookPage(){
  document.getElementById('content').innerHTML=`<section class="section">
    <button class="btn secondary back" onclick="show('home')">← Kembali</button>
    <h2 class="section-title">📚 E-Book</h2>
    <div class="section-sub">Temukan berbagai sumber bacaan digital terpercaya.</div>
    ${(DATA.ebooks||[]).map(r=>`<div class="card"><div class="card-row"><div class="card-icon">${esc(r.Icon||'📚')}</div><div style="flex:1"><h3>${esc(r.Judul)}</h3><p>${esc(r.Deskripsi)}</p><div class="actions"><a class="btn" href="${esc(r.Link)}" target="_blank" rel="noopener">Buka E-Book ↗</a></div></div></div></div>`).join('')}
  </section>`;
}
function catalogPage(){
  const cats=[...new Set(DATA.books.map(b=>b.Kategori).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  document.getElementById('content').innerHTML=`<section class="section">
    <button class="btn secondary back" onclick="show('home')">← Kembali</button>
    <h2 class="section-title">📖 Katalog Digital</h2>
    <div class="section-sub">Cari buku berdasarkan judul, penulis, penerbit, atau kategori.</div>
    <div class="searchbox"><input id="q" placeholder="🔍 Cari judul, penulis..." oninput="filterBooks()"><button class="btn" onclick="filterBooks()">Cari</button></div>
    <div class="selects"><select id="cat" onchange="filterBooks()"><option value="">Semua Kategori</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="stat" onchange="filterBooks()"><option value="">Semua Status</option><option>Tersedia</option><option>Dipinjam</option></select></div>
    <div id="results"></div>
  </section>`;
  filterBooks();
}
function filterBooks(){
  const q=(document.getElementById('q')?.value||'').toLowerCase().trim();
  const cat=document.getElementById('cat')?.value||'', stat=document.getElementById('stat')?.value||'';
  const arr=DATA.books.filter(b=>{
    const text=[b['Judul Buku'],b.Penulis,b.Penerbit,b.Kategori,b['Kode Buku']].join(' ').toLowerCase();
    return (!q||text.includes(q))&&(!cat||b.Kategori===cat)&&(!stat||b.Status===stat);
  });
  const shown=arr.slice(0,30);
  document.getElementById('results').innerHTML=`<div class="count">Menampilkan ${shown.length} dari ${arr.length} buku yang sesuai.</div>`+
  (shown.length?shown.map(b=>`<div class="book-card">
    <div class="book-cover">${esc(b['Judul Buku']).slice(0,26)}</div>
    <div class="book-info"><div class="book-title">${esc(b['Judul Buku'])}</div><div class="book-meta">${esc(b.Penulis)}<br>Kategori: ${esc(b.Kategori)}<br>Status: <span class="status">${esc(b.Status||'')}</span></div>
    <div class="actions"><button class="btn" onclick='detail(${JSON.stringify(b)})'>Detail</button></div></div></div>`).join(''):'<div class="empty">📚 Buku tidak ditemukan.<br>Coba kata kunci atau kategori lain.</div>');
}
function detail(b){
  document.getElementById('content').innerHTML=`<section class="section">
    <button class="btn secondary back" onclick="catalogPage()">← Kembali ke Katalog</button>
    <div class="detail-head"><div class="detail-cover">${esc(b['Judul Buku'])}</div><div><div class="detail-title">${esc(b['Judul Buku'])}</div><div class="detail-author">${esc(b.Penulis)}</div></div></div>
    <div class="table">
      <div class="tr"><b>Kode Buku</b><span>${esc(b['Kode Buku'])}</span></div>
      <div class="tr"><b>Penulis</b><span>${esc(b.Penulis)}</span></div>
      <div class="tr"><b>Penerbit</b><span>${esc(b.Penerbit)}</span></div>
      <div class="tr"><b>Tahun</b><span>${esc(b.Tahun)}</span></div>
      <div class="tr"><b>Kategori</b><span>${esc(b.Kategori)}</span></div>
      <div class="tr"><b>Status</b><span class="status">${esc(b.Status)}</span></div>
    </div>
  </section>`;
}
function rekomPage(){
  document.getElementById('content').innerHTML=`<section class="section">
    <button class="btn secondary back" onclick="show('home')">← Kembali</button>
    <h2 class="section-title">💡 Rekomendasi Digital</h2>

    ${(DATA.rekom||[]).map(r=>`<div class="card"><div class="card-row"><div class="card-icon">💡</div><div style="flex:1"><h3>${esc(r.Judul)}</h3><p>${esc(r.Deskripsi)}</p><div class="actions"><a class="btn" href="${esc(r.Link)}" target="_blank" rel="noopener">Kunjungi ↗</a></div></div></div></div>`).join('')}
  </section>`;
}
