<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LENTERA — Pusat Informasi Digital</title>

<style>
:root{
  --blue:#075aa8; --blue2:#0b79d0; --navy:#06427f; --soft:#eef7ff;
  --line:#dceaf6; --text:#17324d; --muted:#6a8196; --green:#1caa61;
  --shadow:0 8px 25px rgba(17,76,126,.10); --radius:18px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#edf6fd;
  color:var(--text)
}
button,input,select{font:inherit}
.app{

  margin:0 auto;
  min-height:100vh;

  box-shadow:0 0 35px rgba(0,0,0,.08)

.topbar{

  top:0;
  z-index:20;
  height:62px;
  background:linear-gradient(135deg,#06447f,#0878c9);
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px
}
.brand{
  font-weight:800;
  letter-spacing:.5px;
  font-size:18px;
  display:flex;
  gap:8px;
  align-items:center
}
.brand-mark{font-size:22px}
.icon-btn{
  border:0;
  background:transparent;
  color:white;
  font-size:24px;
  cursor:pointer
}
main{padding-bottom:78px}
.hero{
  background:linear-gradient(
    180deg,
    #064b8b 0%,
    #087bcf 56%,
    #eaf6ff 56%,
    #fff 100%
  );
  padding:0 14px 18px
}
.hero-image{
  height:190px;
  border-radius:0 0 24px 24px;
  display:flex;
  align-items:flex-end;
  padding:18px 16px;
  background:
  linear-gradient(180deg,rgba(0,54,110,.08),rgba(0,45,95,.78)),

  color:#fff
}
.hero h1{font-size:29px;margin:0 0 4px}
.hero p{margin:0;font-size:13px;line-height:1.5}
.hero-card{

  margin:-1px 2px 0;

  box-shadow:var(--shadow)
}
.welcome{
  font-size:19px;

  color:var(--navy);

}
.muted{

  font-size:13px;

}
.grid{

}
.grid .menu-card:nth-child(4),

.menu-card .ico{

}
.section{padding:18px 14px}

}
.section-sub{
  font-size:13px;
  color:var(--muted);
  margin-bottom:14px

.card{
  border:1px solid var(--line);

}
.card p{

  line-height:1.5

.btn{

  border-radius:999px;
  padding:9px 14px;
  font-size:12px;

}
.btn.secondary{

}
.actions{

}
.searchbox{

}

.selects select{

  padding:10px;

}
.count{

  color:var(--muted);
  margin:8px 0 10px
}
.book-card{
  display:flex;
  gap:11px;
  padding:11px;

.book-cover{

  justify-content:center;

  font-weight:800;
  font-size:11px;
  text-align:center;
  padding:6px;
  flex:0 0 auto
}
.book-info{
  min-width:0;

}
.book-title{

  color:var(--navy);
  font-size:14px;
  line-height:1.25
}
.book-meta{
  font-size:11px;
  color:var(--muted);

}
.status{
  display:inline-block;
  color:#0b8b4e;
  background:#e4f8ed;
  padding:3px 7px;
  border-radius:999px;

}
.detail-head{

.detail-cover{

.detail-title{

.table{

.tr{

}
.tr:last-child{border-bottom:0}
.tr b{color:var(--navy)}
.quote{
  background:#eaf7ff;
  border:1px solid #c9e9ff;
  border-radius:15px;
  padding:14px;
  font-size:13px;
  line-height:1.5;
  color:#155d8f
}
.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(480px,100%);
  height:68px;
  background:#064b88;
  color:white;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:30;
  box-shadow:0 -4px 18px rgba(0,0,0,.12)
}
.bottom button{
  border:0;
  background:transparent;
  color:white;
  font-size:10px;
  cursor:pointer;
  padding:5px
}
.bottom .ico{
  display:block;
  font-size:21px;
  margin-bottom:3px
}
.bottom button.active{background:#0879c9}
.empty{
  text-align:center;
  padding:30px 10px;
  color:var(--muted);
  font-size:13px
}
.back{margin-bottom:12px}
.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%);
  background:#123d61;
  color:#fff;
  padding:9px 14px;
  border-radius:999px;
  font-size:11px;
  display:none;
  z-index:50;
  max-width:90%;

}
.loading{
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
  font-size:13px
}
.loading .spin{
  font-size:30px;
  display:block;
  margin-bottom:10px;
  animation:putar 1s linear infinite
}
@keyframes putar{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}
.error-box{
  margin:20px 14px;
  padding:16px;
  border-radius:15px;
  background:#fff4f4;
  border:1px solid #f0cccc;

@media(min-width:700px){
  body{padding:20px}
  .app{
    border-radius:25px;
    overflow:hidden
  }

</style>
</head>

<body>

<div class="app">

<header class="topbar">
  <button class="icon-btn" onclick="show('home')" aria-label="Menu">☰</button>

  <div class="brand">
    <span class="brand-mark">📖</span>LENTERA
  </div>

  <button class="icon-btn"
          onclick="toast('Pencarian tersedia di Katalog Digital')"
          aria-label="Cari">⌕</button>
</header>

<main id="content">
  <div class="loading">
    <span class="spin">⟳</span>
    Menghubungkan ke Google Sheet...
  </div>
</main>

<nav class="bottom">
  <button id="nav-home" onclick="show('home')">
    <span class="ico">⌂</span>Home
  </button>

  <button id="nav-ebook" onclick="show('ebook')">
    <span class="ico">▣</span>E-Book
  </button>

  <button id="nav-catalog" onclick="show('catalog')">
    <span class="ico">▤</span>Katalog
  </button>

  <button id="nav-rekom" onclick="show('rekom')">
    <span class="ico">♧</span>Rekomendasi
  </button>
</nav>

</div>

<div class="toast" id="toast"></div>

<script>

/* =========================================================
   PENGATURAN GOOGLE SHEET
   ========================================================= */

const SPREADSHEET_ID =
"1P2Hcw8hiBF-7hoXSnNqgCeyOL7pHT85_CSfAlJmgGqI";

const SHEETS = {
  books: "database buku",
  info: "pusat informasi",
  admin: "admin inovasi",
  ebooks: "ebook",
  rekom: "rekomendasi",
  petunjuk: "petunjuk",
  pilihan: "daftar pilihan"
};


/* =========================================================
   DATA WEBSITE
   ========================================================= */

let DATA = {
  books: [],
  admin: [],
  ebooks: [],
  rekom: [],
  info: {},
  petunjuk: "",
  pilihan: {
    kategori: [],
    status: []
  }
};

let current = 'home';


/* =========================================================
   FUNGSI DASAR
   ========================================================= */

function esc(s){
  return String(s ?? '').replace(
    /[&<>"']/g,
    m => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );
}


function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.display='block';

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.style.display='none';
  },1800);
}


function setActive(id){
  document
    .querySelectorAll('.bottom button')
    .forEach(x=>x.classList.remove('active'));

  const b=document.getElementById('nav-'+id);

  if(b)b.classList.add('active');
}


/* =========================================================
   MEMBACA GOOGLE SHEET
   ========================================================= */

async function getSheet(sheetName){

  const url =
    'https://docs.google.com/spreadsheets/d/' +
    SPREADSHEET_ID +
    '/gviz/tq?tqx=out:json&sheet=' +
    encodeURIComponent(sheetName);

  const response = await fetch(url);

  if(!response.ok){
    throw new Error(
      'Google Sheet tidak dapat diakses (' +
      response.status +
      ')'
    );
  }

  const text = await response.text();

  /*
   Google Visualization mengembalikan:
   google.visualization.Query.setResponse({...})
  */

  const start = text.indexOf('{');
  const end = text.lastIndexOf('}');

  if(start === -1 || end === -1){
    throw new Error(
      'Format data dari sheet "' +
      sheetName +
      '" tidak dikenali.'
    );
  }

  const json = JSON.parse(
    text.substring(start,end+1)
  );

  if(!json.table){
    throw new Error(
      'Sheet "' +
      sheetName +
      '" tidak dapat dibaca.'
    );
  }

  const cols = json.table.cols.map(
    c => String(c.label || '').trim()
  );

  const rows = json.table.rows || [];

  return rows.map(row=>{

    const obj={};

    cols.forEach((header,index)=>{

      if(!header)return;

      const cell =
        row.c &&
        row.c[index];

      let value='';

      if(cell){

        if(cell.v !== null &&
           cell.v !== undefined){

          value=cell.v;
        }

        else if(cell.f !== null &&
                cell.f !== undefined){

          value=cell.f;
        }
      }

      obj[header]=String(value ?? '').trim();

    });

    return obj;

  }).filter(row =>
    Object.values(row).some(v => String(v).trim() !== '')
  );
}


/* =========================================================
   MEMUAT SEMUA DATA
   ========================================================= */

async function loadData(){

  try{

    const [
      books,
      infoRows,
      admin,
      ebooks,
      rekom,
      petunjukRows,
      pilihan
    ] = await Promise.all([

      getSheet(SHEETS.books),

      getSheet(SHEETS.info),

      getSheet(SHEETS.admin),

      getSheet(SHEETS.ebooks),

      getSheet(SHEETS.rekom),

      getSheet(SHEETS.petunjuk),

      getSheet(SHEETS.pilihan)

    ]);


    /* DATABASE BUKU */

    DATA.books = books.map(b=>({

      "No": b["No"] || "",
      "Kode Buku": b["Kode Buku"] || "",
      "Judul Buku": b["Judul Buku"] || "",
      "Penulis": b["Penulis"] || "",
      "Penerbit": b["Penerbit"] || "",
      "Tahun": b["Tahun"] || "",
      "Kategori": b["Kategori"] || "",
      "Status": b["Status"] || ""

    }));


    /* PUSAT INFORMASI */

    DATA.info={};

    infoRows.forEach(row=>{

      const key =
        String(row["kunci"] || '')
        .trim()
        .toUpperCase();

      const value =
        String(row["nilai"] || '').trim();

      if(key){
        DATA.info[key]=value;
      }

    });


    /* ADMIN INOVASI */

    DATA.admin = admin.map((row,index)=>({

      Judul:
        row["judul"] ||
        row["Judul"] ||
        "",

      /*
       Karena sheet Anda saat ini hanya mempunyai
       kolom judul, isi akan menggunakan judul.
       Jika nanti ingin menambahkan isi,
       kita bisa menambah kolomnya.
      */

      Isi:
        row["isi"] ||
        row["Isi"] ||
        "",

      Icon:
        row["icon"] ||
        row["Icon"] ||
        ['📚','📋','📖','💡'][index % 4]

    })).filter(r=>r.Judul);


    /* E-BOOK */

    DATA.ebooks = ebooks.map(row=>({

      Judul:
        row["judul"] ||
        row["Judul"] ||
        "",

      Deskripsi:
        row["deskripsi"] ||
        row["Deskripsi"] ||
        "",

      Link:
        row["link"] ||
        row["Link"] ||
        "",

      Icon:
        row["icon"] ||
        row["Icon"] ||
        "📚"

    })).filter(r=>r.Judul);


    /* REKOMENDASI */

    DATA.rekom = rekom.map(row=>({

      Judul:
        row["judul"] ||
        row["Judul"] ||
        "",

      Deskripsi:
        row["deskripsi"] ||
        row["Deskripsi"] ||
        "",

      Link:
        row["link"] ||
        row["Link"] ||
        "",

      Kategori:
        row["kategori"] ||
        row["Kategori"] ||
        ""

    })).filter(r=>r.Judul);


    /* PETUNJUK */

    DATA.petunjuk =
      petunjukRows
        .map(row =>
          Object.values(row)
            .find(v => String(v).trim() !== '') || ''
        )
        .join('\n');


    /* DAFTAR PILIHAN */

    DATA.pilihan={
      kategori:[],
      status:[]
    };

    pilihan.forEach(row=>{

      const kategori =
        String(
          row["kategori"] ||
          row["Kategori"] ||
          ''
        ).trim();

      const status =
        String(
          row["status"] ||
          row["Status"] ||
          ''
        ).trim();

      if(kategori &&
         !DATA.pilihan.kategori.includes(kategori)){

        DATA.pilihan.kategori.push(kategori);

      }

      if(status &&
         !DATA.pilihan.status.includes(status)){

        DATA.pilihan.status.push(status);

      }

    });


    /*
     Jika daftar pilihan kosong,
     kategori/status tetap dibuat dari
     database buku.
    */

    if(DATA.pilihan.kategori.length===0){

      DATA.pilihan.kategori =
        [...new Set(
          DATA.books
            .map(b=>b.Kategori)
            .filter(Boolean)
        )];

    }


    if(DATA.pilihan.status.length===0){

      DATA.pilihan.status =
        [...new Set(
          DATA.books
            .map(b=>b.Status)
            .filter(Boolean)
        )];

    }


    DATA.pilihan.kategori.sort(
      (a,b)=>a.localeCompare(b)
    );

    DATA.pilihan.status.sort(
      (a,b)=>a.localeCompare(b)
    );


    console.log('Data LENTERA berhasil dimuat:',DATA);

    home();

  }

  catch(error){

    console.error(error);

    document.getElementById('content').innerHTML=`

      <div class="error-box">

        <b>⚠️ Data LENTERA belum dapat dimuat.</b>

        <br><br>

        Website berhasil dibuka, tetapi belum dapat
        mengambil data dari Google Sheet.

        <br><br>

        Pastikan Google Sheet sudah disetel:

        <br>
        <b>Bagikan → Akses umum →
        Siapa saja yang memiliki link →
        Pelihat</b>

        <br><br>

        Setelah itu muat ulang halaman.

        <br><br>

        <small>
        Detail teknis: ${esc(error.message)}
        </small>

      </div>

    `;

  }

}


/* =========================================================
   NAVIGASI
   ========================================================= */

function show(page){

  current=page;

  setActive(
    page==='catalog'
      ?'catalog'
      :page==='ebook'
      ?'ebook'
      :page==='rekom'
      ?'rekom'
      :'home'
  );

  if(page==='home')home();
  if(page==='admin')adminPage();
  if(page==='ebook')ebookPage();
  if(page==='catalog')catalogPage();
  if(page==='rekom')rekomPage();

}


/* =========================================================
   HOME
   ========================================================= */

  <section class="hero">

    <div class="hero-image">

      <div>

        <h1>${esc(i.NAMA||'LENTERA')}</h1>

        <p>
          ${esc(i.SEKOLAH||'DWP SMAN 1 Ngronggot')}
          <br>
          ${esc(i.SUBJUDUL||'Pusat Informasi Digital')}
        </p>

      </div>

    </div>

    <div class="hero-card">

      <div class="welcome">
        Selamat Datang di LENTERA
      </div>

      <div class="muted">
        ${esc(i.DESKRIPSI||'Pojok Literasi Kreatif')}
      </div>

      <div class="grid">

        <div class="menu-card"
             onclick="show('home')">

          <span class="ico">⌂</span>
          Beranda

        </div>

        <div class="menu-card"
             onclick="show('admin')">

          <span class="ico">⚙</span>
          Administrasi & Inovasi

        </div>

        <div class="menu-card"
             onclick="show('ebook')">

          <span class="ico">▣</span>
          E-Book

        </div>

        <div class="menu-card"
             onclick="show('catalog')">

          <span class="ico">▤</span>
          Katalog Digital

        </div>

        <div class="menu-card"
             onclick="show('rekom')">

          <span class="ico">♧</span>

        </div>

      </div>

/* =========================================================
   ADMINISTRASI & INOVASI
   ========================================================= */

function adminPage(){

  const rows=DATA.admin||[];

  document.getElementById('content').innerHTML=`

  <section class="section">

    <button class="btn secondary back"
            onclick="show('home')">
      ← Kembali
    </button>

    <h2 class="section-title">
      ⚙️ Administrasi & Inovasi
    </h2>

    <div class="section-sub">
      Informasi, program, dan inovasi LENTERA.
    </div>

    ${
      rows.length
      ? rows.map((r,idx)=>`

        <div class="card">

          <div class="card-row">

            <div class="card-icon">
              ${esc(
                r.Icon ||
                ['📚','📋','📖','💡'][idx%4]
              )}
            </div>

            <div>

              <h3>
                ${esc(r.Judul)}
              </h3>

              ${
                r.Isi
                ? `<p>${esc(r.Isi)}</p>`
                : ''
              }

            </div>

          </div>

        </div>

      `).join('')
      : `<div class="empty">
          Belum ada data Administrasi & Inovasi.
        </div>`
    }

  </section>

  `;

}


/* =========================================================
   E-BOOK
   ========================================================= */

function ebookPage(){

  document.getElementById('content').innerHTML=`

  <section class="section">

/* =========================================================
   KATALOG
   ========================================================= */

function catalogPage(){

  const cats =
    (
      DATA.pilihan &&
      DATA.pilihan.kategori &&
      DATA.pilihan.kategori.length
    )
    ? DATA.pilihan.kategori
    : [...new Set(
        DATA.books
          .map(b=>b.Kategori)
          .filter(Boolean)
      )];

  const stats =
    (
      DATA.pilihan &&
      DATA.pilihan.status &&
      DATA.pilihan.status.length
    )
    ? DATA.pilihan.status
    : [...new Set(
        DATA.books
          .map(b=>b.Status)
          .filter(Boolean)
      )];


  document.getElementById('content').innerHTML=`

  <section class="section">

    <button class="btn secondary back"
            onclick="show('home')">

      ← Kembali

    </button>

    <h2 class="section-title">
      📖 Katalog Digital
    </h2>

    <div class="section-sub">

      Cari buku berdasarkan judul,
      penulis, penerbit, atau kategori.

    </div>

    <div class="searchbox">

      <input
        id="q"
        placeholder="🔍 Cari judul, penulis..."
        oninput="filterBooks()">

      <button class="btn"
              onclick="filterBooks()">

        Cari

      </button>

    </div>

    <div class="selects">

      <select id="cat"
              onchange="filterBooks()">

        <option value="">
          Semua Kategori
        </option>

        ${
          cats.map(c=>
            `<option value="${esc(c)}">
              ${esc(c)}
            </option>`
          ).join('')
        }

      </select>


      <select id="stat"
              onchange="filterBooks()">

        <option value="">
          Semua Status
        </option>

        ${
          stats.map(s=>
            `<option value="${esc(s)}">
              ${esc(s)}
            </option>`
          ).join('')
        }

      </select>

    </div>

    <div id="results"></div>

  </section>

  `;

  filterBooks();

}


/* =========================================================
   FILTER BUKU
   ========================================================= */

function filterBooks(){

  const q=
    (
      document.getElementById('q')?.value||''
    ).toLowerCase().trim();

  const cat=
    document.getElementById('cat')?.value||'';

  const stat=
    document.getElementById('stat')?.value||'';


  const arr=DATA.books.filter(b=>{

    const text=[
      b['Judul Buku'],
      b.Penulis,
      b.Penerbit,
      b.Kategori,
      b['Kode Buku']
    ]
    .join(' ')
    .toLowerCase();

    return (
      (!q || text.includes(q)) &&
      (!cat || b.Kategori===cat) &&
      (!stat || b.Status===stat)
    );

  });


  const shown=arr.slice(0,30);


  const results=
    document.getElementById('results');

  if(!results)return;


  results.innerHTML=

    `<div class="count">
      Menampilkan ${shown.length}
      dari ${arr.length} buku yang sesuai.
    </div>`

    +

    (

      shown.length

      ?

      shown.map(b=>`

        <div class="book-card">

          <div class="book-cover">

            ${esc(
              b['Judul Buku']
            ).slice(0,26)}

          </div>

          <div class="book-info">

            <div class="book-title">

              ${esc(b['Judul Buku'])}

            </div>

            <div class="book-meta">

              ${esc(b.Penulis)}

              <br>

              Kategori:
              ${esc(b.Kategori)}

              <br>

              Status:

              <span class="status">

                ${esc(b.Status||'')}

              </span>

            </div>

            <div class="actions">

              <button
                class="btn"
                onclick='detail(${JSON.stringify(b)})'>

                Detail

              </button>

            </div>

          </div>

        </div>

      `).join('')

      :

      `<div class="empty">

        📚 Buku tidak ditemukan.

        <br>

        Coba kata kunci atau kategori lain.

      </div>`

    );

}
